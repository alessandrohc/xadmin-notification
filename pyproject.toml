[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xadmin-notification"
version = "1.6.0"
description = "In-admin notifications for staff users: a navbar menu, per-object permissions and a REST feed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "xadmin", "admin", "notifications", "guardian"]
authors = [
    { name = "Alessandro Hecht", email = "alessandrohc@gmail.com" },
]
maintainers = [
    { name = "Alessandro Hecht", email = "alessandrohc@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    # No "License ::" classifier: setuptools>=77 implements PEP 639 and refuses to
    # build when one is combined with the SPDX expression above.
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # setup.py declared no dependencies at all, while three of these are imported at
    # module level -- so a clean install raised ImportError during django.setup().
    #
    # Upper bound on django on purpose: 5.2 is the highest release the suite runs
    # against and the highest the classifiers claim.
    "django>=4.2,<6.0",
    # rest/serializers.py and rest/permission.py build a ModelSerializer and a
    # BasePermission; plugin.py imports rest_framework.exceptions. 3.15 is the first
    # release declaring support for Django 5.0.
    "djangorestframework>=3.15,<4.0",
    # register.py assigns per-object permissions with guardian.shortcuts.assign_perm
    # and plugin.py filters with get_objects_for_user. 2.4 is the first release
    # supporting Django 3.0+; 3.x is current.
    "django-guardian>=2.4,<4.0",
    # adminx.py builds its detail layout with crispy_forms.layout.HTML.
    "django-crispy-forms>=2.0,<3.0",
    # xadmin is deliberately NOT listed. The xadmin this plugin builds on is the fork
    # installed from git by publiqueproject (dist name "xadmin", 3.6.25); the
    # "xadmin" on PyPI is an unrelated project abandoned at 0.6.1. Declaring it would
    # make a clean `pip install` resolve to that dead package or fail outright, so the
    # requirement is documented in the README instead and enforced where it is real:
    # the test suite, which imports the fork.
]

[project.optional-dependencies]
test = [
    "coverage>=7.0",
    # test_packaging.py reads this file; tomllib is only stdlib from 3.11 on.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/alessandrohc/xadmin-notification"
Source = "https://github.com/alessandrohc/xadmin-notification"

[tool.setuptools]
# Templates, the JS and the compiled catalogue live inside the package and are
# selected by MANIFEST.in. Stated explicitly instead of relying on the default so the
# wheel contents do not hinge on a setuptools version.
include-package-data = true

[tool.setuptools.packages.find]
include = ["xplugin_notification*"]
namespaces = false

[tool.coverage.run]
source = ["xplugin_notification"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
